[package]
name = "footos"
version = "0.1.0"
description = "Photo management with map and timeline"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "footos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
footos-core = { path = "../../core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tauri-plugin-os = "2.3.2"
urlencoding = "2.1"
rayon = "1.10"

[patch.crates-io]
# Fix iOS crash in wry::wkwebview::platform_webview_version when NSBundle crashes
# on iOS 26.x simulator. This local patch skips the WebKit bundle lookup on iOS.
wry = { path = "../../../patches/wry" }

# Debug builds are what gets installed on test devices. Image decoding and
# hashing in unoptimised dependencies are 20-50 times slower, which turns a
# first sync of a few hundred photos into many minutes. Our own crate stays
# unoptimised (fast to rebuild, debuggable); everything it calls is optimised.
[profile.dev.package."*"]
opt-level = 3
