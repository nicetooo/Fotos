[package]
name = "footos-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
thiserror = "1.0"
# WARNING: maintain 'pure Rust' and 'platform-independent' constraints.
# DO NOT add features that depend on system dynamic libraries (e.g., dav1d, rav1e, etc.)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2.4"
rusqlite = { version = "0.30", features = ["bundled"] }
kamadak-exif = "0.6"
image_hasher = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
# Pure Rust MP4/MOV/M4V container parser — zero system dependencies.
# Used for video metadata extraction (duration, codecs, dimensions, creation_time).
mp4 = "0.14"
tracing = "0.1"
uniffi = { version = "0.28", features = ["tokio"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
serde_json = "1"
